<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CallOnFail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 32rem;">
    <div class="card shadow-sm">
      <div class="card-body text-center py-5">
        {% if ok %}
        <h1 class="h4 mb-3">Escalamiento detenido</h1>
        <p class="text-muted mb-0">Recibimos OK. No se llaman más contactos de esta alarma.</p>
        {% else %}
        <h1 class="h4 mb-3">Enlace invalido</h1>
        <p class="text-muted mb-0">Este acuse no existe o ya no es valido.</p>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
