<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CallOnFail{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">CallOnFail</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('devices') }}">Dispositivos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('tenants') }}">Clientes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('health') }}">Health</a>
            </li>
          </ul>
          {% if session.get("authenticated") %}
          <form class="d-flex ms-auto align-items-center gap-2" method="post" action="{{ url_for('logout') }}">
            {{ csrf_field() }}
            <span class="navbar-text small">Admin: {{ session.get("username") }}</span>
            <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
          </form>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
