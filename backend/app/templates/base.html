<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CallOnFail{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      :root {
        --cof-surface: #ffffff;
        --cof-border: #e6eaf0;
        --cof-muted: #6b7280;
      }

      body {
        background: #f4f6f9;
        color: #1f2937;
      }

      .navbar {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .navbar-brand {
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      main.container,
      main.container-fluid {
        max-width: 1280px;
      }

      .card {
        border: 1px solid var(--cof-border);
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }

      .card-header {
        background: #fff;
        border-bottom: 1px solid var(--cof-border);
        font-weight: 600;
      }

      .meta-label {
        color: var(--cof-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.2rem;
      }

      .meta-value {
        font-weight: 600;
        word-break: break-word;
      }

      .action-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .json-box,
      pre.json-box,
      pre code {
        max-width: 100%;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .event-list,
      .config-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .event-item,
      .config-item {
        border-top: 1px solid var(--cof-border);
        padding: 0.75rem 1rem;
      }

      .event-item:first-child,
      .config-item:first-child {
        border-top: 0;
      }

      .event-main,
      .config-main {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        min-width: 0;
      }

      .event-body,
      .config-body {
        flex: 1;
        min-width: 0;
      }

      .event-title,
      .config-title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 0.6rem;
        margin-bottom: 0.15rem;
      }

      .event-message,
      .config-meta {
        color: var(--cof-muted);
        font-size: 0.875rem;
        overflow-wrap: anywhere;
      }

      .event-time,
      .config-time {
        color: var(--cof-muted);
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .icon-btn {
        width: 2rem;
        height: 2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        border: 1px solid var(--cof-border);
        background: #fff;
        color: #4b5563;
        flex: 0 0 auto;
      }

      .icon-btn:hover,
      .icon-btn:focus {
        background: #f8fafc;
        color: #111827;
      }

      .icon-btn[aria-expanded="true"] {
        background: #eef2ff;
        border-color: #c7d2fe;
        color: #3730a3;
      }

      .payload-panel {
        margin-top: 0.75rem;
        padding: 0.75rem;
        border: 1px solid var(--cof-border);
        border-radius: 0.5rem;
        background: #f8fafc;
      }

      .chip-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .table td,
      .table th {
        vertical-align: middle;
      }

      .table td {
        overflow-wrap: anywhere;
      }

      @media (max-width: 991.98px) {
        .action-bar .btn {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid" style="max-width: 1280px;">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">CallOnFail</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('devices') }}">Dispositivos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('tenants') }}">Clientes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('health') }}">Health</a>
            </li>
          </ul>
          {% if session.get("authenticated") %}
          <form class="d-flex ms-auto align-items-center gap-2" method="post" action="{{ url_for('logout') }}">
            {{ csrf_field() }}
            <span class="navbar-text small">{{ session.get("username") }}</span>
            <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
          </form>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
