{% extends "base.html" %}

{% block title %}Nuevo cliente - CallOnFail{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{{ url_for('tenants') }}">&larr; Volver a clientes</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h3">Nuevo cliente</h1>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="name">Nombre</label>
        <input class="form-control" id="name" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="slug">Slug</label>
        <input class="form-control" id="slug" name="slug" placeholder="opcional, se genera desde el nombre">
      </div>
      <button class="btn btn-primary" type="submit">Crear cliente</button>
    </form>
  </div>
</div>
{% endblock %}
