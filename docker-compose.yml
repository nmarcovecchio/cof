services:
  web:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-callonfail}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-callonfail}
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  mqtt-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "python -m app.init_db && python -m app.mqtt_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-callonfail}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-callonfail}
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callonfail}
      POSTGRES_USER: ${POSTGRES_USER:-callonfail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callonfail} -d ${POSTGRES_DB:-callonfail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@callonfail.com.ar}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  caddy_data:
  caddy_config:
